<!doctype html>
<html lang="ru">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Лабораторная — Руслан Мородецкий</title>
      <link
         rel="preload"
         href="./fonts/montserrat-v26-latin-400.woff2"
         as="font"
         type="font/woff2"
         crossorigin
      />
      <link
         rel="stylesheet"
         href="./fonts/montserrat.css"
         media="print"
         onload="this.media = 'all'"
      />
      <link
         rel="stylesheet"
         href="css/style.css"
         media="print"
         onload="this.media = 'all'"
      />
      <link
         rel="stylesheet"
         href="css/theme-system.css"
         media="print"
         onload="this.media = 'all'"
      />
      <link
         rel="stylesheet"
         href="css/markdown-modal.css"
         media="print"
         onload="this.media = 'all'"
      />
      <link
         rel="stylesheet"
         href="css/file-manager.css"
         media="print"
         onload="this.media = 'all'"
      />
      <script>
         (function () {
            const key = 'workspace-theme';
            const dark = window.matchMedia(
               '(prefers-color-scheme: dark)',
            ).matches;
            let v = null;
            try {
               v = localStorage.getItem(key);
            } catch {}
            if (v === 'dark' || v === 'light') {
               document.documentElement.setAttribute(
                  'data-theme',
                  v === 'dark' ? 'dark' : '',
               );
            } else if (dark) {
               document.documentElement.setAttribute('data-theme', 'dark');
            }
         })();
      </script>
      <script type="module" src="js/menu.js"></script>
      <script
         defer
         src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
      ></script>
      <script
         defer
         src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
      ></script>
      <script
         defer
         src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
      ></script>
      <script type="module" src="js/lab.js"></script>
   </head>
   <body>
      <header class="header">
         <a class="logo" href="index.html"
            ><span lang="ja">雨</span> Amagai Rei</a
         >

         <nav class="nav" aria-label="Основная навигация">
            <a href="index.html">Главная</a>
            <a href="index.html#tasks">Предметы</a>
            <a href="#contacts">Контакты</a>
         </nav>

         <div class="header__actions">
            <button
               class="theme-toggle"
               id="theme-toggle"
               type="button"
               aria-pressed="false"
               aria-label="Включить тёмную тему"
            >
               <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
            </button>

            <details class="mobile-menu">
               <summary
                  class="mobile-menu__summary"
                  aria-label="Меню"
               ></summary>
               <nav class="mobile-menu__nav" aria-label="Мобильная навигация">
                  <a href="index.html">Главная</a>
                  <a href="index.html#tasks">Предметы</a>
                  <a href="#contacts">Контакты</a>
               </nav>
            </details>
         </div>
      </header>

      <main>
         <div class="page-head" id="lab-head">
            <nav
               class="breadcrumbs"
               id="breadcrumbs"
               aria-label="Хлебные крошки"
            ></nav>
         </div>
         <div id="lab-body">
            <p class="section section--tight empty">Загрузка…</p>
         </div>
      </main>

      <footer class="footer" id="contacts">
         <div class="socials">
            <a
               data-contact="github"
               href="#"
               aria-label="GitHub"
               title="GitHub"
            >
               <svg viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="8 7 3 12 8 17" />
                  <polyline points="16 7 21 12 16 17" />
                  <line x1="14" y1="5" x2="10" y2="19" />
               </svg>
            </a>
            <a
               data-contact="telegram"
               href="#"
               aria-label="Telegram"
               title="Telegram"
            >
               <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21.5 3.5 2.5 11l6 2.3 2 6.2 3.2-3.8 4.6 3.4z" />
                  <path d="M8.5 13.3 21.5 3.5" />
               </svg>
            </a>
            <a data-contact="email" href="#" aria-label="Почта" title="Почта">
               <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <polyline points="3 7 12 13 21 7" />
               </svg>
            </a>
         </div>
         <p class="footer__note">
            <span lang="ja">雨</span> Amagai Rei <span lang="ja">雨</span>
         </p>
      </footer>

      <script>
         if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
         }
      </script>
   </body>
</html>
