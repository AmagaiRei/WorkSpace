<!doctype html>
<html lang="ru">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <title>Лабораторная — Руслан Мородецкий</title>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
         href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;700;800&display=swap"
         rel="stylesheet"
      />
      <link rel="stylesheet" href="css/style.css" />
      <link rel="stylesheet" href="css/theme-system.css" />
      <link rel="stylesheet" href="css/smooth-motion.css" />
      <link rel="stylesheet" href="css/performance.css" />
      <script src="js/theme.js"></script>
      <script type="module" src="js/menu.js"></script>
      <script type="module" src="js/lab.js"></script>
   </head>
   <body>
      <header class="header">
         <a class="logo" href="index.html"
            ><span lang="ja">雨</span> Amagai Rei</a
         >

         <nav class="nav" aria-label="Основная навигация">
            <a href="index.html">Главная</a>
            <a href="index.html#tasks">Предметы</a>
            <a href="#contacts">Контакты</a>
         </nav>

         <div class="header__actions">
            <button
               class="theme-toggle"
               id="theme-toggle"
               type="button"
               aria-pressed="false"
               aria-label="Включить тёмную тему"
            >
               <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
            </button>

            <details class="mobile-menu">
               <summary
                  class="mobile-menu__summary"
                  aria-label="Меню"
               ></summary>
               <nav class="mobile-menu__nav" aria-label="Мобильная навигация">
                  <a href="index.html">Главная</a>
                  <a href="index.html#tasks">Предметы</a>
                  <a href="#contacts">Контакты</a>
               </nav>
            </details>
         </div>
      </header>

      <main>
         <div class="page-head" id="lab-head">
            <nav
               class="breadcrumbs"
               id="breadcrumbs"
               aria-label="Хлебные крошки"
            ></nav>
         </div>
         <div id="lab-body">
            <p class="section section--tight empty">Загрузка…</p>
         </div>
      </main>

      <footer class="footer" id="contacts">
         <div class="socials">
            <a
               data-contact="github"
               href="#"
               aria-label="GitHub"
               title="GitHub"
            >
               <svg viewBox="0 0 24 24" aria-hidden="true">
                  <polyline points="8 7 3 12 8 17" />
                  <polyline points="16 7 21 12 16 17" />
                  <line x1="14" y1="5" x2="10" y2="19" />
               </svg>
            </a>
            <a
               data-contact="telegram"
               href="#"
               aria-label="Telegram"
               title="Telegram"
            >
               <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M21.5 3.5 2.5 11l6 2.3 2 6.2 3.2-3.8 4.6 3.4z" />
                  <path d="M8.5 13.3 21.5 3.5" />
               </svg>
            </a>
            <a data-contact="email" href="#" aria-label="Почта" title="Почта">
               <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2" />
                  <polyline points="3 7 12 13 21 7" />
               </svg>
            </a>
         </div>
         <p class="footer__note">
            <span lang="ja">雨</span> Amagai Rei <span lang="ja">雨</span>
         </p>
      </footer>
   </body>
</html>
