<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Лабораторная — Руслан Мородецкий</title>

    <!--! Inline critical CSS для мгновенного первого кадра -->
    <style>
      /*Critical CSS — минимальные стили для первого рендера */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      :root {
        --ws-bg: #0a0414;
        --ws-surface: #120a1f;
        --ws-surface-elevated: #1a1028;
        --ws-text: #f5f0ff;
        --ws-text-muted: #b8a8d0;
        --ws-border: #2a1a3a;
        --ws-border-strong: #3d2a52;
        --ws-accent: #8b5cf6;
        --ws-accent-glow: #a78bfa;
        --ws-focus-ring: #8b5cf6;
        --ws-shadow-sm: 0 2px 8px rgba(10, 4, 20, 0.4);
        --ws-shadow-md: 0 8px 24px rgba(10, 4, 20, 0.5);
        --ws-shadow-lg: 0 16px 48px rgba(10, 4, 20, 0.6);
        --ws-radius-sm: 8px;
        --ws-radius-md: 12px;
        --ws-radius-lg: 16px;
        --ws-radius-xl: 24px;
        --ws-space-xs: 4px;
        --ws-space-sm: 8px;
        --ws-space-md: 16px;
        --ws-space-lg: 24px;
        --ws-space-xl: 32px;
        --ws-space-2xl: 48px;
        --ws-font-sans:
          "Montserrat", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        --ws-font-mono: "JetBrains Mono", Fira Code, Consolas, monospace;
        --ws-motion-fast: 120ms;
        --ws-motion-normal: 200ms;
        --ws-motion-slow: 350ms;
        --ws-glass-blur: 12px;
        --ws-glass-opacity: 0.95;
        --ws-neon-intensity: 1;
      }
      html {
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      body {
        margin: 0;
        font-family: var(--ws-font-sans);
        background: var(--ws-bg);
        color: var(--ws-text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .header {
        position: sticky;
        top: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--ws-space-md);
        padding: var(--ws-space-md) var(--ws-space-xl);
        background: rgba(18, 10, 31, 0.9);
        backdrop-filter: blur(var(--ws-glass-blur));
        border-bottom: 1px solid var(--ws-border);
      }
      .logo {
        font-weight: 800;
        font-size: 1.25rem;
        color: var(--ws-text);
        text-decoration: none;
        letter-spacing: 0.5px;
      }
      .nav {
        display: flex;
        gap: var(--ws-space-lg);
      }
      .nav a {
        color: var(--ws-text-muted);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.9rem;
        transition: color var(--ws-motion-fast);
      }
      .nav a:hover {
        color: var(--ws-accent);
      }
      .header__actions {
        display: flex;
        align-items: center;
        gap: var(--ws-space-sm);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--ws-space-sm);
        padding: var(--ws-space-sm) var(--ws-space-lg);
        font-family: var(--ws-font-sans);
        font-weight: 600;
        font-size: 0.9rem;
        border: none;
        border-radius: var(--ws-radius-md);
        background: linear-gradient(135deg, var(--ws-accent), #6d28d9);
        color: #fff;
        cursor: pointer;
        text-decoration: none;
        transition:
          transform var(--ws-motion-fast),
          box-shadow var(--ws-motion-fast);
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 24px rgba(139, 92, 246, 0.4);
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .search {
        padding: var(--ws-space-sm) var(--ws-space-md);
        font-family: var(--ws-font-sans);
        font-size: 0.9rem;
        border: 1px solid var(--ws-border);
        border-radius: var(--ws-radius-md);
        background: var(--ws-surface);
        color: var(--ws-text);
        width: 100%;
        max-width: 320px;
      }
      .section {
        padding: var(--ws-space-2xl) var(--ws-space-xl);
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }
      .section__title {
        font-size: 1.75rem;
        font-weight: 800;
        margin: 0 0 var(--ws-space-sm);
        background: linear-gradient(135deg, var(--ws-text), var(--ws-accent));
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .section__lead {
        color: var(--ws-text-muted);
        margin: 0 0 var(--ws-space-xl);
      }
      .page-head {
        padding: var(--ws-space-lg) var(--ws-space-xl);
        max-width: 1200px;
        margin: 0 auto;
        width: 100%;
      }
      .breadcrumbs {
        display: flex;
        gap: var(--ws-space-sm);
        font-size: 0.85rem;
        color: var(--ws-text-muted);
        flex-wrap: wrap;
      }
      .breadcrumbs a {
        color: var(--ws-text-muted);
        text-decoration: none;
        transition: color var(--ws-motion-fast);
      }
      .breadcrumbs a:hover {
        color: var(--ws-accent);
      }
      .breadcrumbs .sep {
        color: var(--ws-border);
      }
      .footer {
        margin-top: auto;
        padding: var(--ws-space-xl);
        text-align: center;
        border-top: 1px solid var(--ws-border);
        background: var(--ws-surface);
      }
      .socials {
        display: flex;
        justify-content: center;
        gap: var(--ws-space-lg);
        margin-bottom: var(--ws-space-md);
      }
      .socials a {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--ws-bg);
        border: 1px solid var(--ws-border);
        color: var(--ws-text-muted);
        text-decoration: none;
        transition:
          color var(--ws-motion-fast),
          border-color var(--ws-motion-fast),
          transform var(--ws-motion-fast);
      }
      .socials a:hover {
        color: var(--ws-accent);
        border-color: var(--ws-accent);
        transform: translateY(-2px);
      }
      .footer__note {
        font-size: 0.8rem;
        color: var(--ws-text-muted);
        margin: 0;
      }
    </style>

    <!--! Адаптивный загрузчик — ДО CSS, чтобы классы успели примениться -->
    <script type="module" src="js/adaptive/adaptive-loader.js"></script>

    <!--! Critical CSS + fonts — блокирующий рендер, но минимальный -->
    <link rel="preload" as="style" href="css/critical.css" />
    <link rel="stylesheet" href="css/critical.css" />

    <!--! Font preloads — только самые нужные начертения -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/Montserrat-VariableFont_wght.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/JetBrainsMono-VariableFont_wght.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/SpaceGrotesk-VariableFont_wght.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/Montserrat-Regular.woff2"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="fonts/JetBrainsMono-Regular.woff2"
    />

    <!--! Preconnect для внешних CDN -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />

    <!--! Modulepreload для критических JS -->
    <link rel="modulepreload" href="js/utils/common.js" />
    <link rel="modulepreload" href="js/core/lab.js" />
    <link rel="modulepreload" href="js/components/menu.js" />
    <link rel="modulepreload" href="js/components/theme.js" />
    <link rel="modulepreload" href="js/adaptive/adaptive-store.js" />

    <!--! Theme CSS — ленивая загрузка (включает components, motion, adaptive, utilities) -->
    <link rel="preload" as="style" href="css/theme.css" />
    <link
      rel="stylesheet"
      href="css/theme.css"
      media="print"
      onload="this.media = 'all'"
    />
    <!--! Layout лабораторной: сетка, дерево файлов и размеры элементов -->
    <link rel="stylesheet" href="css/template-layout.css" />

    <!--! Тёмная тема — применяется до отрисовки (нет мигания) -->
    <script src="js/components/theme.js"></script>

    <!--! Основные модули -->
    <script type="module" src="js/components/menu.js"></script>
    <script type="module" src="js/core/lab.js"></script>

    <!--! Внешние библиотеки (defer) -->
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"
    ></script>
    <script
      defer
      src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"
    ></script>

    <!--! Noscript fallback для отключённого JS -->
    <noscript>
      <link rel="stylesheet" href="css/critical.css" />
      <link rel="stylesheet" href="css/theme.css" />
      <style>
        /* Fallback для тёмной темы без JS */
        html {
          background: var(--color-bg-base);
          color: var(--color-text-primary);
        }
        .theme-toggle {
          display: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <!--! SVG Sprite — подключается первым для использования через <use> -->
    <svg style="display: none">
      <use href="images/icons.svg#icon-github"></use>
      <use href="images/icons.svg#icon-telegram"></use>
      <use href="images/icons.svg#icon-email"></use>
      <use href="images/icons.svg#icon-menu"></use>
      <use href="images/icons.svg#icon-close"></use>
    </svg>

    <header class="header header--lab">
      <a class="logo" href="index.html"
        ><span class="logo__mark" aria-hidden="true">✦</span
        ><span lang="ja">雨</span> Amagai Rei</a
      >

      <nav class="nav" aria-label="Основная навигация">
        <a href="index.html">Главная</a>
        <a href="index.html#tasks">Предметы</a>
        <a href="sync.html">Синхронизация</a>
        <a href="#contacts">Контакты</a>
      </nav>

      <div class="header__actions">
        <a
          class="github-sync"
          href="sync.html"
          aria-label="Синхронизация с GitHub"
        >
          <span class="github-sync__icon" aria-hidden="true">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              aria-hidden="true"
            >
              <path
                d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"
              />
            </svg>
          </span>
          <span class="github-sync__text">Sync</span>
        </a>

        <details class="mobile-menu">
          <summary class="mobile-menu__summary" aria-label="Меню"></summary>
          <nav class="mobile-menu__nav" aria-label="Мобильная навигация">
            <a href="index.html">Главная</a>
            <a href="index.html#tasks">Предметы</a>
            <a href="sync.html">Синхронизация</a>
            <a href="#contacts">Контакты</a>
          </nav>
        </details>
      </div>
    </header>

    <main>
      <div class="page-head" id="lab-head">
        <nav
          class="breadcrumbs"
          id="breadcrumbs"
          aria-label="Хлебные крошки"
        ></nav>
      </div>
      <div id="lab-body">
        <p class="section section--tight empty">Загрузка…</p>
      </div>
    </main>

    <footer class="footer" id="contacts">
      <div class="socials">
        <a data-contact="github" href="#" aria-label="GitHub" title="GitHub">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <use href="images/icons.svg#icon-github"></use>
          </svg>
        </a>
        <a
          data-contact="telegram"
          href="#"
          aria-label="Telegram"
          title="Telegram"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <use href="images/icons.svg#icon-telegram"></use>
          </svg>
        </a>
        <a data-contact="email" href="#" aria-label="Почта" title="Почта">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <use href="images/icons.svg#icon-email"></use>
          </svg>
        </a>
      </div>
      <p class="footer__note">
        <span lang="ja">雨</span> Amagai Rei <span lang="ja">雨</span>
      </p>
    </footer>
  </body>
</html>
